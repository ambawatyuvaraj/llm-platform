apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-platform
  namespace: argocd
  finalizers:
    - resourcers-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ambawatyuvaraj/llm-platform
    targetRevision: main
    path: charts/vllm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-serving
  syncPolicy:
    automated:
      prune: true
      sefHeal: true
    syncOptions:
      - CreateNamespace = true
      - ServerSideApply = true