name: CI/CD — LLM Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write

jobs:

  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version
      - run: helm lint charts/vllm/
      - run: |
          helm template vllm charts/vllm/ \
            --set ingress.host=test.duckdns.org 
          

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Render Helm templates
        run: |
          mkdir -p /tmp/rendered
          helm template vllm charts/vllm/ \
            --set ingress.host=test.duckdns.org \
            --set prometheusRule.enabled=false \
            --set networkPolicy.enabled=false \
            > /tmp/rendered/manifests.yaml

      - name: Trivy scan rendered manifests
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          scan-type: config
          scan-ref: /tmp/rendered/
          severity: HIGH,CRITICAL
          exit-code: 1
          format: sarif
          output: trivy-results.sarif

      - if: always()
        uses: github/codeql-action/upload-sarif@4fa2a7953630fd2f3fb380f21be14ede0169dd4f
        with:
          sarif_file: trivy-results.sarif

  deploy:
    name: Update Image Tag
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update image tag in values.yaml
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          sed -i "/^image:/,/^[^ ]/ s/^  tag:.*/  tag: \"${SHORT_SHA}\"/" \
            charts/vllm/values.yaml
          echo "Updated tag to: $SHORT_SHA"
      - name: Commit and push manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/vllm/values.yaml
          git diff --staged --quiet || \
            git commit -m "ci: update image tag to ${GITHUB_SHA::8} [skip ci]"
          git push
