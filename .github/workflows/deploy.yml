name: CI/CD For LLM PLATFORM


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write

jobs:

  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: azure/setup-helm@b9e51907a09c216f16ebe1d4480728a6f928c494
        with:
          version: "3.14.0"
      - run: |
          helm template vllm charts/vllm \
            --set ingress.host=test.duckdns.org \
            | kubectl apply --dry-run=client -f -
    
  security:
      name: Trivy security scan
      runs-on: ubuntu-latest
      needs: lint
      steps:
        - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        - uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa7cce1229c54b2c9bd0d8
          with:
            scan-type: config
            scan-ref: charts/
            severity: HIGH,CRITICAL
            exit-code: 1
            formart: sarif
            output: trivy-results.sarif
        - if: always()
          uses: github/codeq1-action/upload-sarif@4fa2a7953630fd2f3fb380f21be14ede0169dd4f
          with:
            sarif_file: trivy-results.sarif
  deploy:
    name: Update Image tag
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update image tag in values.yaml
        run: | 
          SHORT_SHA="${GITHUB_SHA::8}"
          sed -i "/^image:/,/^[^ ]/ s/^ tag:.*/ tag: \"${SHORT_SHA}\"/" \
            charts/vllm/values.yaml
          echo "updated tag to: $SHORT_SHA"
      - name: commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/vllm/values.yaml
          git diff --staged --quiet || \
            git commit -m "ci: update image tag to ${GITHUB_SHA::8} {skip ci}"
          git push

