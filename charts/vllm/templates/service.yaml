apiVersion: v1
kind: Service
metadata:
    name: {{ .Relase.Name }}-vllm
    namespace: {{ .Relase.Namespace }}
    labels:
        app: vllm
spec:
    type: {{ .Values.service.type }}
    ports:
    - port: {{  .Values.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
    selector:
        app: vllm